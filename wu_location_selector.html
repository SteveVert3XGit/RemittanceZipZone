<script>
function exportPDF() {
  if (typeof html2pdf === 'undefined') {
    alert('PDF export unavailable — library failed to load. Check your internet connection.');
    return;
  }
  const btn = document.getElementById('pdf-btn');
  btn.textContent = 'Generating...';
  btn.disabled = true;
  const opt = {
    margin:      [8, 8],
    filename:    'wu_competitive_intel_33147.pdf',
    image:       { type: 'jpeg', quality: 0.95 },
    html2canvas: { scale: 2, useCORS: true },
    jsPDF:       { unit: 'mm', format: 'a4', orientation: 'landscape' }
  };
  html2pdf().set(opt).from(document.getElementById('app')).save()
    .then(() => { btn.textContent = '⬇ Export PDF'; btn.disabled = false; })
    .catch(() => { btn.textContent = '⬇ Export PDF'; btn.disabled = false; alert('PDF export failed. Check your connection.'); });
}

// ─── COORDINATE HELPER ────────────────────────────────────────────────────────
function latLngToSVG(lat, lng) {
  const m = getZip().map;
  return {
    x: Math.min(m.svgW, Math.max(0, ((lng - m.lngMin) / m.lngRange) * m.svgW)),
    y: Math.min(m.svgH, Math.max(0, (1 - (lat - m.latMin) / m.latRange) * m.svgH))
  };
}

// ─── PIN RENDERING ────────────────────────────────────────────────────────────
function renderPins() {
  const layer = document.getElementById('pins-layer');
  layer.innerHTML = '';
  getZip().stores.forEach(s => {
    const cfg = CATEGORIES[s.category];
    if (!cfg) return;
    const { x, y } = latLngToSVG(s.lat, s.lng);
    const r = cfg.r;
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.setAttribute('data-id', s.id);
    g.setAttribute('data-cat', s.category);
    g.setAttribute('class', 'pin');
    g.style.cursor = 'pointer';
    // Drop shape (triangle below circle)
    const drop = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
    const tipY = y + r + 8;
    drop.setAttribute('points', `${x - r * 0.5},${y + r * 0.6} ${x + r * 0.5},${y + r * 0.6} ${x},${tipY}`);
    drop.setAttribute('fill', cfg.color);
    // Circle
    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', x);
    circle.setAttribute('cy', y);
    circle.setAttribute('r', r);
    circle.setAttribute('fill', cfg.color);
    circle.setAttribute('stroke', '#0f1117');
    circle.setAttribute('stroke-width', '1.5');
    g.appendChild(drop);
    g.appendChild(circle);
    g.addEventListener('mouseenter', () => g.style.filter = 'brightness(1.25)');
    g.addEventListener('mouseleave', () => g.style.filter = '');
    g.addEventListener('click', () => showPin(s));
    if (s.bigbox) g.style.opacity = '0.35';
    layer.appendChild(g);
    if (!activeToggles.has(s.category)) g.style.display = 'none';
  });
}

function toggleCategory(cat, btn) {
  if (activeToggles.has(cat)) {
    activeToggles.delete(cat);
    btn.style.opacity = '0.35';
  } else {
    activeToggles.add(cat);
    btn.style.opacity = '1';
  }
  document.querySelectorAll(`.pin[data-cat="${cat}"]`).forEach(el => {
    el.style.display = activeToggles.has(cat) ? '' : 'none';
  });
}

function toggleZones(key, btn) {
  if (activeToggles.has(key)) {
    activeToggles.delete(key);
    btn.style.opacity = '0.35';
  } else {
    activeToggles.add(key);
    btn.style.opacity = '1';
  }
  document.querySelectorAll(`.zone-ellipse[data-type="${key}"]`).forEach(el => {
    el.style.display = activeToggles.has(key) ? '' : 'none';
  });
}

}

// ─── SPATIAL HELPERS ──────────────────────────────────────────────────────────
function nearestCorridor(lat, lng) {
  const { ns, ew } = getZip().corridors;
  if (!ns.length || !ew.length) return `${lat.toFixed(4)}, ${lng.toFixed(4)}`;
  const nsStreet = ns.reduce((a, b) => Math.abs(lng - a.lng) < Math.abs(lng - b.lng) ? a : b);
  const ewStreet = ew.reduce((a, b) => Math.abs(lat - a.lat) < Math.abs(lat - b.lat) ? a : b);
  return `${nsStreet.name} @ ${ewStreet.name}`;
}

function haversine(lat1, lng1, lat2, lng2) {
  const R = 3958.8;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLng = (lng2 - lng1) * Math.PI / 180;
  const a = Math.sin(dLat / 2) ** 2 +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLng / 2) ** 2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
}

// ─── ZONE COMPUTATION ─────────────────────────────────────────────────────────
let _zonesCache = null;
function computeZones() {
  if (_zonesCache) return _zonesCache;
  const allStores    = getZip().stores;
  const demandStores = allStores.filter(s => DEMAND_WEIGHTS[s.category] !== undefined && !s.bigbox);
  const competitors  = allStores.filter(s => (s.category === 'moneygram' || s.category === 'ria') && !s.bigbox);
  const wuStores     = allStores.filter(s => s.category === 'western_union' && !s.bigbox);

  const visited = new Set();
  const clusters = [];
  demandStores.forEach(seed => {
    if (visited.has(seed.id)) return;
    const members = demandStores.filter(s =>
      haversine(seed.lat, seed.lng, s.lat, s.lng) <= CLUSTER_RADIUS_MI
    );
    members.forEach(m => visited.add(m.id));
    const centroid = {
      lat: members.reduce((sum, m) => sum + m.lat, 0) / members.length,
      lng: members.reduce((sum, m) => sum + m.lng, 0) / members.length
    };
    const baseScore = members.reduce((sum, m) => sum + (DEMAND_WEIGHTS[m.category] || 0), 0);
    const compBonus = competitors.filter(c =>
      haversine(centroid.lat, centroid.lng, c.lat, c.lng) <= COMPETITOR_RADIUS_MI
    ).length * COMPETITOR_BONUS;
    const adjDemand = baseScore + compBonus;
    const wuCount = wuStores.filter(w =>
      haversine(centroid.lat, centroid.lng, w.lat, w.lng) <= WU_RADIUS_MI
    ).length;

    let type = null;
    if (adjDemand >= HIGH_DEMAND_THRESHOLD && wuCount === 0) type = 'zones_expand';
    else if (adjDemand >= HIGH_DEMAND_THRESHOLD && wuCount >= 2) type = 'zones_monitor';
    else if (adjDemand < LOW_DEMAND_THRESHOLD  && wuCount >= 2) type = 'zones_reduce';

    clusters.push({ centroid, members, adjDemand, wuCount, type, compBonus, label: nearestCorridor(centroid.lat, centroid.lng) });
  });

  // Second pass: seed from WU positions to catch self-cannibalization clusters
  // that have no nearby demand signals (so they'd never appear in pass 1)
  const wuVisited = new Set();
  wuStores.forEach(seed => {
    if (wuVisited.has(seed.id)) return;
    const wuCluster = wuStores.filter(w =>
      haversine(seed.lat, seed.lng, w.lat, w.lng) <= WU_CANNIBALIZATION_RADIUS_MI
    );
    wuCluster.forEach(w => wuVisited.add(w.id));
    if (wuCluster.length < 2) return;
    const centroid = {
      lat: wuCluster.reduce((sum, w) => sum + w.lat, 0) / wuCluster.length,
      lng: wuCluster.reduce((sum, w) => sum + w.lng, 0) / wuCluster.length
    };
    const nearbyDemand = demandStores.filter(s =>
      haversine(centroid.lat, centroid.lng, s.lat, s.lng) <= CLUSTER_RADIUS_MI
    );
    const baseScore = nearbyDemand.reduce((sum, s) => sum + (DEMAND_WEIGHTS[s.category] || 0), 0);
    const compBonus = competitors.filter(c =>
      haversine(centroid.lat, centroid.lng, c.lat, c.lng) <= COMPETITOR_RADIUS_MI
    ).length * COMPETITOR_BONUS;
    const adjDemand = baseScore + compBonus;
    // 3+ WU in tight radius = cannibalization regardless of demand; 2 WU + low demand also flagged
    if (wuCluster.length >= 3 || adjDemand < LOW_DEMAND_THRESHOLD) {
      clusters.push({ centroid, members: wuCluster, adjDemand, wuCount: wuCluster.length, type: 'zones_reduce', compBonus, source: 'wu_seeded', label: nearestCorridor(centroid.lat, centroid.lng) });
    }
  });

  _zonesCache = clusters.filter(c => c.type !== null);
  return _zonesCache;
}

// ─── ZONE RENDERING ───────────────────────────────────────────────────────────
const ZONE_CONFIG = {
  zones_expand:  { stroke: 'rgba(63,185,80,0.6)',  label: 'Underserved — Open Here' },
  zones_monitor: { stroke: 'rgba(240,192,64,0.6)', label: 'High Demand — Monitor' },
  zones_reduce:  { stroke: 'rgba(248,81,73,0.6)',  label: 'WU Oversaturated — Review' }
};

function renderZones() {
  const layer = document.getElementById('zones-layer');
  layer.innerHTML = '';

  let defs = document.getElementById('zone-defs');
  if (!defs) {
    defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
    defs.id = 'zone-defs';
    document.getElementById('map-svg').insertBefore(defs, layer);
  }
  defs.innerHTML = '';

  const zones = computeZones();
  zones.forEach((zone, i) => {
    const cfg = ZONE_CONFIG[zone.type];
    if (!cfg) return;
    const { x, y } = latLngToSVG(zone.centroid.lat, zone.centroid.lng);
    const rx = Math.max(40, 40 + zone.members.length * 8);
    const ry = rx * 0.65;

    const gradId = `zone-grad-${i}`;
    const grad = document.createElementNS('http://www.w3.org/2000/svg', 'radialGradient');
    grad.setAttribute('id', gradId);
    grad.innerHTML = `
      <stop offset="0%"   stop-color="${cfg.stroke}" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="${cfg.stroke}" stop-opacity="0"/>
    `;
    defs.appendChild(grad);

    const ellipse = document.createElementNS('http://www.w3.org/2000/svg', 'ellipse');
    ellipse.setAttribute('cx', x);
    ellipse.setAttribute('cy', y);
    ellipse.setAttribute('rx', rx);
    ellipse.setAttribute('ry', ry);
    ellipse.setAttribute('fill', `url(#${gradId})`);
    ellipse.setAttribute('stroke', cfg.stroke);
    ellipse.setAttribute('stroke-width', '1');
    ellipse.setAttribute('class', 'zone-ellipse');
    ellipse.setAttribute('data-type', zone.type);
    if (!activeToggles.has(zone.type)) ellipse.style.display = 'none';
    layer.appendChild(ellipse);

    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', x);
    text.setAttribute('y', y - ry - 5);
    text.setAttribute('text-anchor', 'middle');
    text.setAttribute('fill', cfg.stroke);
    text.setAttribute('font-size', '9');
    text.setAttribute('font-family', 'monospace');
    text.setAttribute('class', 'zone-ellipse');
    text.setAttribute('data-type', zone.type);
    text.textContent = zone.label;
    if (!activeToggles.has(zone.type)) text.style.display = 'none';
    layer.appendChild(text);
  });
}

// ─── SCORECARD ────────────────────────────────────────────────────────────────
function renderScorecard() {
  const zones = computeZones();
  const expand  = zones.filter(z => z.type === 'zones_expand');
  const monitor = zones.filter(z => z.type === 'zones_monitor');
  const reduce  = zones.filter(z => z.type === 'zones_reduce');

  const allStores = getZip().stores;
  const wuCount  = allStores.filter(s => s.category === 'western_union' && !s.bigbox).length;
  const mgCount  = allStores.filter(s => s.category === 'moneygram'     && !s.bigbox).length;
  const riaCount = allStores.filter(s => s.category === 'ria'           && !s.bigbox).length;

  const zoneRow = (zone, idx) => `
    <div class="scorecard-row">
      <strong>${idx + 1}.</strong> ${zone.label}
      <div class="scorecard-sub">Demand: ${zone.adjDemand} · WU nearby: ${zone.wuCount} · ${zone.members.length} signals</div>
    </div>`;

  document.getElementById('scorecard').innerHTML = `
    <div class="scorecard-label">ZONE ANALYSIS</div>
    ${expand.length ? `<div class="scorecard-section expand"><div class="scorecard-title">▲ EXPAND (${expand.length})</div>${expand.map(zoneRow).join('')}</div>` : ''}
    ${monitor.length ? `<div class="scorecard-section monitor"><div class="scorecard-title">⚠ MONITOR (${monitor.length})</div>${monitor.map(zoneRow).join('')}</div>` : ''}
    ${reduce.length ? `<div class="scorecard-section reduce"><div class="scorecard-title">▼ REDUCE (${reduce.length})</div>${reduce.map(zoneRow).join('')}</div>` : ''}
    ${!expand.length && !monitor.length && !reduce.length ? '<div class="scorecard-empty">No zones detected with current thresholds.</div>' : ''}
    <div class="scorecard-counts">
      <div class="scorecard-label" style="margin-top:10px;margin-bottom:6px">STORE COUNT (OWNED/INDEPENDENT)</div>
      <div class="count-row"><span style="color:#F5C518">●</span> Western Union <strong>${wuCount}</strong></div>
      <div class="count-row"><span style="color:#004B87">●</span> MoneyGram <strong>${mgCount}</strong></div>
      <div class="count-row"><span style="color:#E31837">●</span> Ria <strong>${riaCount}</strong></div>
    </div>
  `;
}

// ─── NARRATIVE ────────────────────────────────────────────────────────────────
function renderNarrative() {
  const zones = computeZones();
  const expand  = zones.filter(z => z.type === 'zones_expand');
  const monitor = zones.filter(z => z.type === 'zones_monitor');
  const reduce  = zones.filter(z => z.type === 'zones_reduce');

  const allStores2   = getZip().stores;
  const wuCount  = allStores2.filter(s => s.category === 'western_union' && !s.bigbox).length;
  const mgCount  = allStores2.filter(s => s.category === 'moneygram'     && !s.bigbox).length;
  const riaCount = allStores2.filter(s => s.category === 'ria'           && !s.bigbox).length;
  const totalSignals = allStores2.filter(s => DEMAND_WEIGHTS[s.category] !== undefined).length;

  const expandRows = expand.map((z, i) => `
    <div class="narrative-item">
      <div class="narrative-rank">${i + 1}</div>
      <div>
        <div class="narrative-item-title">${z.label}</div>
        <div class="narrative-item-desc">Adjusted demand: ${z.adjDemand} · ${z.members.length} demand signals · ${z.compBonus > 0 ? `+${z.compBonus} competitor validation` : 'No competitor nearby'} · 0 WU within ${WU_RADIUS_MI}mi</div>
      </div>
    </div>`).join('') || '<div class="narrative-empty">No expansion zones identified with current thresholds.</div>';

  const reduceRows = reduce.map((z, i) => `
    <div class="narrative-item">
      <div class="narrative-rank">${i + 1}</div>
      <div>
        <div class="narrative-item-title">${z.label}</div>
        <div class="narrative-item-desc">Adjusted demand: ${z.adjDemand} (below threshold of ${LOW_DEMAND_THRESHOLD}) · ${z.wuCount} WU within ${WU_RADIUS_MI}mi · Low market justification for WU density</div>
      </div>
    </div>`).join('') || '<div class="narrative-empty">No saturation concerns with current thresholds.</div>';

  const monitorRows = monitor.map((z, i) => `
    <div class="narrative-item">
      <div class="narrative-rank">${i + 1}</div>
      <div>
        <div class="narrative-item-title">${z.label}</div>
        <div class="narrative-item-desc">Adjusted demand: ${z.adjDemand} · ${z.members.length} demand signals · ${z.compBonus > 0 ? `+${z.compBonus} competitor validation` : 'No competitor nearby'} · ${z.wuCount} WU within ${WU_RADIUS_MI}mi</div>
      </div>
    </div>`).join('') || '<div class="narrative-empty">No monitor zones identified.</div>';

  document.getElementById('narrative').innerHTML = `
    <div class="narrative-header">COMPETITIVE INTELLIGENCE SUMMARY — ZIP ${activeZip}</div>
    <div class="narrative-grid narrative-grid-3">
      <div class="narrative-col expand">
        <div class="narrative-col-title">▲ OPEN NEW LOCATIONS</div>
        ${expandRows}
      </div>
      <div class="narrative-col monitor">
        <div class="narrative-col-title">⚠ MONITOR — HIGH DENSITY</div>
        ${monitorRows}
      </div>
      <div class="narrative-col reduce">
        <div class="narrative-col-title">▼ REDUCE FOOTPRINT</div>
        ${reduceRows}
      </div>
    </div>
    <div class="narrative-context">
      ZIP 33147 has ${wuCount + mgCount + riaCount} remittance locations across 3 providers.
      Western Union: ${wuCount} · MoneyGram: ${mgCount} · Ria: ${riaCount}.
      ${totalSignals} demand-signal businesses mapped (ethnic groceries, financial services, dollar stores, laundromats).
      ${expand.length > 0 ? `${expand.length} expansion zone${expand.length > 1 ? 's' : ''} identified — high demand, no WU coverage.` : 'No clear expansion gaps identified.'}
      ${monitor.length > 0 ? `${monitor.length} monitor zone${monitor.length > 1 ? 's' : ''} flagged — high demand with multiple WU locations; watch for competitor entry.` : ''}
      ${reduce.length > 0 ? `${reduce.length} saturation zone${reduce.length > 1 ? 's' : ''} flagged — WU density exceeds demand justification.` : 'No saturation concerns identified.'}
    </div>
  `;
}

// ─── STREET GRID ──────────────────────────────────────────────────────────────
function renderStreets() {
  const layer = document.getElementById('streets');
  layer.innerHTML = '';
  const m = getZip().map;
  const SVG_NS = 'http://www.w3.org/2000/svg';
  getZip().streets.forEach(s => {
    const line = document.createElementNS(SVG_NS, 'line');
    if (s.type === 'ew') {
      line.setAttribute('x1', 0);      line.setAttribute('y1', s.y);
      line.setAttribute('x2', m.svgW); line.setAttribute('y2', s.y);
    } else {
      line.setAttribute('x1', s.x); line.setAttribute('y1', 0);
      line.setAttribute('x2', s.x); line.setAttribute('y2', m.svgH);
    }
    line.setAttribute('stroke', '#2a3340');
    line.setAttribute('stroke-width', s.weight);
    layer.appendChild(line);
    const text = document.createElementNS(SVG_NS, 'text');
    text.setAttribute('fill', '#3a4a5a');
    text.setAttribute('font-size', '9');
    text.setAttribute('font-family', 'monospace');
    if (s.type === 'ew') {
      text.setAttribute('x', s.labelX);
      text.setAttribute('y', s.labelY);
    } else {
      const midY = m.svgH / 2;
      text.setAttribute('x', s.x);
      text.setAttribute('y', midY);
      text.setAttribute('transform', `rotate(-90 ${s.x} ${midY})`);
      text.setAttribute('text-anchor', 'middle');
    }
    text.textContent = s.label;
    layer.appendChild(text);
  });
}

    <div class="demo-grid">
      <div class="demo-card">
        <div class="demo-card-label">Total Population</div>
        <div class="demo-card-value">${d.population}</div>
        <div class="demo-card-sub">${d.areaName}</div>
      </div>
      <div class="demo-card highlight">
        <div class="demo-card-label">Foreign-Born</div>
        <div class="demo-card-value">${d.foreignBorn.pct}</div>
        <div class="demo-card-sub">${d.foreignBorn.count}</div>
      </div>
      <div class="demo-card highlight">

        <div class="demo-card-sub">${d.unbanked.note}</div>

// ─── INIT ─────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  renderToggles();
  renderStreets();
  renderPins();
  renderZones();
  renderScorecard();
  renderNarrative();
  renderDemographics();
});
</script>
